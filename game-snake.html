<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스네이크 - CalcZip 게임</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5000637956714787" crossorigin="anonymous"></script>
  <script>(function(){const t=localStorage.getItem('calczip-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    .game-wrap { max-width:420px; margin:0 auto; }
    .game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .score-row { display:flex; gap:8px; }
    .score-box { background:var(--surface-2); border-radius:var(--radius-sm); padding:6px 14px; text-align:center; }
    .score-label { font-size:10px; color:var(--text-muted); }
    .score-val { font-size:18px; font-weight:800; color:var(--text-primary); }
    .game-btn { padding:7px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--text-primary); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); }
    .game-btn:hover { border-color:var(--primary); color:var(--primary); }
    canvas { border-radius:8px; display:block; touch-action:none; }
    .d-pad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,48px); gap:4px; margin:12px auto 0; width:fit-content; }
    .d-btn { width:48px; height:48px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .d-btn:active { background:var(--primary); color:#fff; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Calc<span>Zip</span></a>
    <div class="header-right">
      <nav class="header-nav"><a href="index.html">홈</a></nav>
      <button class="dark-toggle" onclick="toggleDark()" id="dark-btn">🌙</button>
    </div>
  </div>
</header>
<div class="page-layout">
  <aside class="side-ad"><div class="side-ad-inner">광고 영역<br/>160×600</div></aside>
  <main class="main-content">
    <nav class="breadcrumb"><a href="index.html">홈</a><span>›</span><span>스네이크</span></nav>
    <div class="game-wrap">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:4px">🐍 스네이크</h1>
      <div class="game-header">
        <div class="score-row">
          <div class="score-box"><div class="score-label">점수</div><div class="score-val" id="score">0</div></div>
          <div class="score-box"><div class="score-label">최고</div><div class="score-val" id="best">0</div></div>
        </div>
        <button class="game-btn" onclick="startGame()">시작 / 재시작</button>
      </div>
      <canvas id="canvas" width="400" height="400"></canvas>
      <!-- 모바일 방향키 -->
      <div class="d-pad">
        <div></div>
        <button class="d-btn" onclick="setDir(0,-1)">▲</button>
        <div></div>
        <button class="d-btn" onclick="setDir(-1,0)">◀</button>
        <div></div>
        <button class="d-btn" onclick="setDir(1,0)">▶</button>
        <div></div>
        <button class="d-btn" onclick="setDir(0,1)">▼</button>
        <div></div>
      </div>
      <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px">⌨️ 방향키 또는 WASD</p>
    </div>
    <div style="margin-top:20px">
      <div class="section-title">다른 게임</div>
      <div class="related-grid">
        <a href="game-apple.html" class="related-card"><div class="r-icon">🍎</div>사과 게임</a>
        <a href="game-2048.html" class="related-card"><div class="r-icon">🔢</div>2048</a>
        <a href="game-minesweeper.html" class="related-card"><div class="r-icon">💣</div>지뢰찾기</a>
        <a href="game-tetris.html" class="related-card"><div class="r-icon">⬛</div>테트리스</a>
      </div>
    </div>
  </main>
  <aside class="side-ad"><div class="side-ad-inner">광고 영역<br/>160×600</div></aside>
</div>
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-links"><a href="index.html">홈</a><a href="privacy.html">개인정보처리방침</a></div>
    <p class="footer-copy">© 2026 CalcZip. All rights reserved.</p>
  </div>
</footer>
<script>
const GRID=20, CELL=20, canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let snake, dir, nextDir, food, score, best=parseInt(localStorage.getItem('snake-best')||'0'), interval, running=false;
document.getElementById('best').textContent=best;

function startGame() {
  clearInterval(interval);
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; running=true;
  spawnFood();
  document.getElementById('score').textContent=0;
  interval=setInterval(step,130);
}

function spawnFood() {
  do { food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)}; }
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function step() {
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    clearInterval(interval); running=false;
    drawGameOver(); return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y) { score+=10; document.getElementById('score').textContent=score; if(score>best){best=score;localStorage.setItem('snake-best',best);document.getElementById('best').textContent=best;} spawnFood(); }
  else snake.pop();
  draw();
}

function setDir(x,y) { if(!(dir.x===-x&&dir.y===-y)) nextDir={x,y}; }

function draw() {
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  ctx.fillStyle = isDark?'#1a1d27':'#f9fafb';
  ctx.fillRect(0,0,400,400);
  // grid
  ctx.strokeStyle = isDark?'#2e3347':'#e5e7eb';
  ctx.lineWidth=0.5;
  for(let i=0;i<=GRID;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(400,i*CELL);ctx.stroke();}
  // snake
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0?(isDark?'#60a5fa':'#2563eb'):(isDark?'#93c5fd':'#3b82f6');
    ctx.beginPath();ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);ctx.fill();
  });
  // food
  ctx.font=`${CELL-2}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🍎',food.x*CELL+CELL/2,food.y*CELL+CELL/2+1);
}

function drawGameOver() {
  draw();
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Game Over',200,180);
  ctx.font='18px sans-serif'; ctx.fillText('점수: '+score,200,215);
  ctx.font='14px sans-serif'; ctx.fillStyle='#ddd'; ctx.fillText('시작 버튼을 눌러 다시 시작',200,250);
}

document.addEventListener('keydown',e=>{
  const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  if(map[e.key]){e.preventDefault();if(running)setDir(map[e.key].x,map[e.key].y);}
});

// 스와이프
let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(!running)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
});

function toggleDark() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark?'light':'dark');
  localStorage.setItem('calczip-theme', isDark?'light':'dark');
  document.getElementById('dark-btn').textContent = isDark?'🌙':'☀️';
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('dark-btn').textContent = document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
  draw();
});
</script>
</body>
</html>
