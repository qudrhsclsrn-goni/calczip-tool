<script>
const GRID=20, CELL=20, canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let snake, dir, nextDir, food, score, best=parseInt(localStorage.getItem('snake-best')||'0'), interval, running=false;
document.getElementById('best').textContent=best;

function startGame() {
  clearInterval(interval);
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; running=true;
  spawnFood();
  document.getElementById('score').textContent=0;
  interval=setInterval(step,130);
}

function spawnFood() {
  do { food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)}; }
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function step() {
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    clearInterval(interval); running=false;
    drawGameOver(); return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y) { score+=10; document.getElementById('score').textContent=score; if(score>best){best=score;localStorage.setItem('snake-best',best);document.getElementById('best').textContent=best;} spawnFood(); }
  else snake.pop();
  draw();
}

function setDir(x,y) { if(!(dir.x===-x&&dir.y===-y)) nextDir={x,y}; }

function draw() {
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  ctx.fillStyle = isDark?'#1a1d27':'#f9fafb';
  ctx.fillRect(0,0,400,400);
  // grid
  ctx.strokeStyle = isDark?'#2e3347':'#e5e7eb';
  ctx.lineWidth=0.5;
  for(let i=0;i<=GRID;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(400,i*CELL);ctx.stroke();}
  // snake
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0?(isDark?'#60a5fa':'#2563eb'):(isDark?'#93c5fd':'#3b82f6');
    ctx.beginPath();ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);ctx.fill();
  });
  // food
  ctx.font=`${CELL-2}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🍎',food.x*CELL+CELL/2,food.y*CELL+CELL/2+1);
}

function drawGameOver() {
  draw();
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Game Over',200,180);
  ctx.font='18px sans-serif'; ctx.fillText('점수: '+score,200,215);
  ctx.font='14px sans-serif'; ctx.fillStyle='#ddd'; ctx.fillText('시작 버튼을 눌러 다시 시작',200,250);
  if(score > 0) setTimeout(() => showScoreModal(score), 800);
}

document.addEventListener('keydown',e=>{
  const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
  if(map[e.key]){e.preventDefault();if(running)setDir(map[e.key].x,map[e.key].y);}
});

// 스와이프
let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(!running)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
});


let _pendingScore = 0;

function showScoreModal(score) {
  _pendingScore = score;
  document.getElementById('modal-score').textContent = score.toLocaleString() + '점';
  document.getElementById('modal-msg').textContent = '';
  document.getElementById('nickname-input').value = localStorage.getItem('lb-nickname') || '';
  document.getElementById('score-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('nickname-input').focus(), 100);
}

function closeModal() {
  document.getElementById('score-modal').style.display = 'none';
  const game = document.body.dataset.game;
  if(game) window.renderLeaderboard(game);
}

async function submitScore() {
  const nick = document.getElementById('nickname-input').value.trim();
  if(!nick) { document.getElementById('modal-msg').textContent = '닉네임을 입력해주세요'; return; }
  localStorage.setItem('lb-nickname', nick);
  document.getElementById('modal-msg').textContent = '등록 중...';
  const game = document.body.dataset.game;
  const ok = await window.saveScore(game, nick, _pendingScore);
  if(ok) {
    document.getElementById('modal-msg').textContent = '✅ 등록 완료!';
    setTimeout(() => { closeModal(); }, 1000);
  } else {
    document.getElementById('modal-msg').textContent = '❌ 등록 실패. 다시 시도해주세요.';
  }
}

function toggleDark() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark?'light':'dark');
  localStorage.setItem('calczip-theme', isDark?'light':'dark');
  document.getElementById('dark-btn').textContent = isDark?'🌙':'☀️';
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('dark-btn').textContent = document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
  draw();
});
</script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDdiNApueUlXQIRYDRBAuTnjWFf4ZNTsnU",
      authDomain: "goni-6492d.firebaseapp.com",
      projectId: "goni-6492d",
      storageBucket: "goni-6492d.firebasestorage.app",
      messagingSenderId: "251038196229",
      appId: "1:251038196229:web:6eca90c7ae1ca0c906726c"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    function getWeekStart() {
      const now = new Date();
      const day = now.getDay();
      const diff = day === 0 ? 6 : day - 1;
      const monday = new Date(now);
      monday.setDate(now.getDate() - diff);
      monday.setHours(0,0,0,0);
      return Timestamp.fromDate(monday);
    }

    window.saveScore = async function(game, nickname, score) {
      try {
        await addDoc(collection(db, 'leaderboard', game, 'scores'), {
          nickname: nickname.slice(0,10), score, createdAt: Timestamp.now()
        });
        return true;
      } catch(e) { console.error(e); return false; }
    };

    window.getTopScores = async function(game) {
      try {
        const q = query(
          collection(db, 'leaderboard', game, 'scores'),
          where('createdAt', '>=', getWeekStart()),
          limit(100)
        );
        const snap = await getDocs(q);
        const docs = snap.docs.map(d => d.data());
        docs.sort((a,b) => b.score - a.score);
        return docs.slice(0,10);
      } catch(e) { console.error(e); return []; }
    };

    window.renderLeaderboard = async function(game) {
      const el = document.getElementById('lb-list');
      if(!el) return;
      el.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:12px">불러오는 중...</div>';
      const scores = await window.getTopScores(game);
      if(scores.length === 0) {
        el.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:12px">아직 등록된 점수가 없어요. 첫 번째 도전자가 되세요!</div>';
        return;
      }
      const medals = ['🥇','🥈','🥉'];
      el.innerHTML = scores.map((s,i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px">
          <span style="font-size:16px;width:24px;text-align:center">${medals[i]||i+1}</span>
          <span style="flex:1;font-weight:${i<3?'700':'400'};color:var(--text-primary)">${s.nickname}</span>
          <span style="font-weight:700;color:var(--primary)">${s.score.toLocaleString()}점</span>
        </div>
      `).join('');
    };

    // 페이지 로드 시 자동 렌더
    document.addEventListener('DOMContentLoaded', () => {
      const game = document.body.dataset.game;
      if(game) window.renderLeaderboard(game);
    });
  </script>
