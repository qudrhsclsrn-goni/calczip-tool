<script>
const ROWS=8,COLS=10,TIME=120;
let grid,score,timeLeft,timerInterval,dragging=false,startCell=null,selected=[];

function newGame() {
  clearInterval(timerInterval);
  grid=Array(ROWS).fill(null).map(()=>Array(COLS).fill(0).map(()=>Math.floor(Math.random()*9)+1));
  score=0; timeLeft=TIME;
  document.getElementById('score').textContent=0;
  document.getElementById('result-msg').style.display='none';
  document.getElementById('sum-display').textContent='';
  updateRemain();
  render();
  timerInterval=setInterval(()=>{
    timeLeft--;
    document.getElementById('timer-val').textContent=timeLeft;
    document.getElementById('timer-fill').style.width=(timeLeft/TIME*100)+'%';
    if(timeLeft<=0){clearInterval(timerInterval);endGame();}
  },1000);
}

function updateRemain() {
  const cnt=grid.flat().filter(v=>v>0).length;
  document.getElementById('remain').textContent=cnt;
  if(cnt===0){clearInterval(timerInterval);endGame(true);}
}

function render() {
  const el=document.getElementById('apple-grid');
  el.innerHTML='';
  grid.forEach((row,r)=>row.forEach((v,c)=>{
    const div=document.createElement('div');
    div.className='apple '+(v===0?'removed':'normal');
    div.textContent=v>0?v:'';
    div.dataset.r=r; div.dataset.c=c;
    el.appendChild(div);
  }));
  setupDrag();
}

function setupDrag() {
  const el=document.getElementById('apple-grid');
  let box=null;

  const getCell=(x,y)=>{
    const cells=el.querySelectorAll('.apple:not(.removed)');
    for(const cell of cells){
      const rect=cell.getBoundingClientRect();
      if(x>=rect.left&&x<=rect.right&&y>=rect.top&&y<=rect.bottom) return cell;
    }
    return null;
  };

  const getRect=(x1,y1,x2,y2)=>({ left:Math.min(x1,x2),top:Math.min(y1,y2),right:Math.max(x1,x2),bottom:Math.max(y1,y2) });

  const getSelected=(sx,sy,ex,ey)=>{
    const sel=[]; const rect=getRect(sx,sy,ex,ey);
    el.querySelectorAll('.apple:not(.removed)').forEach(cell=>{
      const cr=cell.getBoundingClientRect();
      const cx=(cr.left+cr.right)/2, cy=(cr.top+cr.bottom)/2;
      if(cx>=rect.left&&cx<=rect.right&&cy>=rect.top&&cy<=rect.bottom) sel.push(cell);
    });
    return sel;
  };

  const updateSelection=(sel)=>{
    el.querySelectorAll('.apple').forEach(c=>c.classList.remove('selected'));
    let sum=0; sel.forEach(c=>{c.classList.add('selected');sum+=parseInt(c.textContent)||0;});
    const disp=document.getElementById('sum-display');
    if(sel.length===0){disp.textContent='';return;}
    disp.textContent='합계: '+sum+(sum===10?' ✓':'');
    disp.className='sum-display '+(sum===10?'sum-ok':sum>10?'sum-over':'');
  };

  let sx,sy;
  el.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('removed'))return;
    dragging=true; sx=e.clientX; sy=e.clientY;
    box=document.createElement('div'); box.className='select-box';
    el.appendChild(box);
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging||!box)return;
    const gr=el.getBoundingClientRect();
    box.style.left=Math.min(sx,e.clientX)-gr.left+'px';
    box.style.top=Math.min(sy,e.clientY)-gr.top+'px';
    box.style.width=Math.abs(e.clientX-sx)+'px';
    box.style.height=Math.abs(e.clientY-sy)+'px';
    updateSelection(getSelected(sx,sy,e.clientX,e.clientY));
  });
  window.addEventListener('mouseup',e=>{
    if(!dragging)return; dragging=false;
    if(box){box.remove();box=null;}
    const sel=getSelected(sx,sy,e.clientX,e.clientY);
    const sum=sel.reduce((s,c)=>s+(parseInt(c.textContent)||0),0);
    if(sum===10&&sel.length>0){
      sel.forEach(c=>{grid[parseInt(c.dataset.r)][parseInt(c.dataset.c)]=0;});
      score+=sel.length*10; document.getElementById('score').textContent=score;
      render(); updateRemain();
    } else {
      el.querySelectorAll('.apple').forEach(c=>c.classList.remove('selected'));
      document.getElementById('sum-display').textContent='';
    }
  });

  // 터치
  el.addEventListener('touchstart',e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; dragging=true;
    box=document.createElement('div');box.className='select-box';el.appendChild(box);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!dragging||!box)return;
    const t=e.touches[0]; const gr=el.getBoundingClientRect();
    box.style.left=Math.min(sx,t.clientX)-gr.left+'px';
    box.style.top=Math.min(sy,t.clientY)-gr.top+'px';
    box.style.width=Math.abs(t.clientX-sx)+'px';
    box.style.height=Math.abs(t.clientY-sy)+'px';
    updateSelection(getSelected(sx,sy,t.clientX,t.clientY));
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!dragging)return; dragging=false;
    if(box){box.remove();box=null;}
    const t=e.changedTouches[0];
    const sel=getSelected(sx,sy,t.clientX,t.clientY);
    const sum=sel.reduce((s,c)=>s+(parseInt(c.textContent)||0),0);
    if(sum===10&&sel.length>0){
      sel.forEach(c=>{grid[parseInt(c.dataset.r)][parseInt(c.dataset.c)]=0;});
      score+=sel.length*10; document.getElementById('score').textContent=score;
      render(); updateRemain();
    } else {
      el.querySelectorAll('.apple').forEach(c=>c.classList.remove('selected'));
      document.getElementById('sum-display').textContent='';
    }
  });
}

function endGame(cleared=false) {
  const el=document.getElementById('result-msg');
  el.style.display='';
  el.innerHTML=`<div style="font-size:22px;font-weight:800;margin-bottom:8px">${cleared?'🎉 완전 클리어!':'⏰ 시간 종료!'}</div><div style="font-size:15px;color:var(--text-muted);margin-bottom:12px">최종 점수: <strong>${score}점</strong></div><button class="game-btn" onclick="newGame()">다시 하기</button>`;
  if(score > 0) setTimeout(() => showScoreModal(score), 600);
}


let _pendingScore = 0;

function showScoreModal(score) {
  _pendingScore = score;
  document.getElementById('modal-score').textContent = score.toLocaleString() + '점';
  document.getElementById('modal-msg').textContent = '';
  document.getElementById('nickname-input').value = localStorage.getItem('lb-nickname') || '';
  document.getElementById('score-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('nickname-input').focus(), 100);
}

function closeModal() {
  document.getElementById('score-modal').style.display = 'none';
  const game = document.body.dataset.game;
  if(game) window.renderLeaderboard(game);
}

async function submitScore() {
  const nick = document.getElementById('nickname-input').value.trim();
  if(!nick) { document.getElementById('modal-msg').textContent = '닉네임을 입력해주세요'; return; }
  localStorage.setItem('lb-nickname', nick);
  document.getElementById('modal-msg').textContent = '등록 중...';
  const game = document.body.dataset.game;
  const ok = await window.saveScore(game, nick, _pendingScore);
  if(ok) {
    document.getElementById('modal-msg').textContent = '✅ 등록 완료!';
    setTimeout(() => { closeModal(); }, 1000);
  } else {
    document.getElementById('modal-msg').textContent = '❌ 등록 실패. 다시 시도해주세요.';
  }
}

function toggleDark() {
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',isDark?'light':'dark');
  localStorage.setItem('calczip-theme',isDark?'light':'dark');
  document.getElementById('dark-btn').textContent=isDark?'🌙':'☀️';
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('dark-btn').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
  newGame();
});
</script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDdiNApueUlXQIRYDRBAuTnjWFf4ZNTsnU",
      authDomain: "goni-6492d.firebaseapp.com",
      projectId: "goni-6492d",
      storageBucket: "goni-6492d.firebasestorage.app",
      messagingSenderId: "251038196229",
      appId: "1:251038196229:web:6eca90c7ae1ca0c906726c"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    function getWeekStart() {
      const now = new Date();
      const day = now.getDay();
      const diff = day === 0 ? 6 : day - 1;
      const monday = new Date(now);
      monday.setDate(now.getDate() - diff);
      monday.setHours(0,0,0,0);
      return Timestamp.fromDate(monday);
    }

    window.saveScore = async function(game, nickname, score) {
      try {
        await addDoc(collection(db, 'leaderboard', game, 'scores'), {
          nickname: nickname.slice(0,10), score, createdAt: Timestamp.now()
        });
        return true;
      } catch(e) { console.error(e); return false; }
    };

    window.getTopScores = async function(game) {
      try {
        const q = query(
          collection(db, 'leaderboard', game, 'scores'),
          where('createdAt', '>=', getWeekStart()),
          limit(100)
        );
        const snap = await getDocs(q);
        const docs = snap.docs.map(d => d.data());
        docs.sort((a,b) => b.score - a.score);
        return docs.slice(0,10);
      } catch(e) { console.error(e); return []; }
    };

    window.renderLeaderboard = async function(game) {
      const el = document.getElementById('lb-list');
      if(!el) return;
      el.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:12px">불러오는 중...</div>';
      const scores = await window.getTopScores(game);
      if(scores.length === 0) {
        el.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:12px">아직 등록된 점수가 없어요. 첫 번째 도전자가 되세요!</div>';
        return;
      }
      const medals = ['🥇','🥈','🥉'];
      el.innerHTML = scores.map((s,i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px">
          <span style="font-size:16px;width:24px;text-align:center">${medals[i]||i+1}</span>
          <span style="flex:1;font-weight:${i<3?'700':'400'};color:var(--text-primary)">${s.nickname}</span>
          <span style="font-weight:700;color:var(--primary)">${s.score.toLocaleString()}점</span>
        </div>
      `).join('');
    };

    // 페이지 로드 시 자동 렌더
    document.addEventListener('DOMContentLoaded', () => {
      const game = document.body.dataset.game;
      if(game) window.renderLeaderboard(game);
    });
  </script>
