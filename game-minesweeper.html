<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지뢰찾기 - CalcZip 게임</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5000637956714787" crossorigin="anonymous"></script>
  <script>(function(){const t=localStorage.getItem('calczip-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    .game-wrap { max-width:500px; margin:0 auto; }
    .game-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
    .diff-btns { display:flex; gap:6px; }
    .diff-btn { padding:6px 12px; border:1px solid var(--border); border-radius:20px; background:none; font-size:12px; color:var(--text-muted); cursor:pointer; font-family:var(--font); transition:all 0.15s; }
    .diff-btn.active { border-color:var(--primary); color:var(--primary); background:var(--highlight-bg); }
    .info-row { display:flex; gap:10px; align-items:center; }
    .info-box { background:var(--surface-2); border-radius:var(--radius-sm); padding:6px 14px; text-align:center; }
    .info-label { font-size:10px; color:var(--text-muted); }
    .info-val { font-size:18px; font-weight:800; color:var(--text-primary); }
    .game-btn { padding:7px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--text-primary); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); }
    .game-btn:hover { border-color:var(--primary); color:var(--primary); }
    .ms-board { display:inline-grid; gap:2px; background:var(--border); border-radius:6px; overflow:hidden; padding:2px; }
    .ms-cell { width:32px; height:32px; border:none; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.1s; border-radius:3px; font-family:var(--font); }
    .ms-cell.hidden { background:var(--surface-2); }
    .ms-cell.hidden:hover { background:var(--border-2); }
    .ms-cell.flagged { background:var(--surface-2); }
    .ms-cell.open { background:var(--bg); cursor:default; }
    .ms-cell.mine { background:#fef2f2; }
    .ms-cell.exploded { background:#dc2626; color:#fff; }
    .c1{color:#2563eb} .c2{color:#16a34a} .c3{color:#dc2626} .c4{color:#7c3aed} .c5{color:#92400e} .c6{color:#0891b2} .c7{color:#111827} .c8{color:#6b7280}
    .board-center { text-align:center; overflow-x:auto; }
    .overlay-msg { text-align:center; padding:20px; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); margin-top:10px; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Calc<span>Zip</span></a>
    <div class="header-right">
      <nav class="header-nav"><a href="index.html">홈</a></nav>
      <button class="dark-toggle" onclick="toggleDark()" id="dark-btn">🌙</button>
    </div>
  </div>
</header>
<div class="page-layout">
  <aside class="side-ad"><div class="side-ad-inner">광고 영역<br/>160×600</div></aside>
  <main class="main-content">
    <nav class="breadcrumb"><a href="index.html">홈</a><span>›</span><span>지뢰찾기</span></nav>
    <div class="game-wrap">
      <h1 style="font-size:22px;font-weight:800;margin-bottom:4px">💣 지뢰찾기</h1>
      <div class="game-header">
        <div class="diff-btns">
          <button class="diff-btn active" onclick="setDiff('easy')">쉬움 9×9</button>
          <button class="diff-btn" onclick="setDiff('medium')">보통 16×16</button>
          <button class="diff-btn" onclick="setDiff('hard')">어려움 16×30</button>
        </div>
        <div class="info-row">
          <div class="info-box"><div class="info-label">💣</div><div class="info-val" id="mine-count">10</div></div>
          <div class="info-box"><div class="info-label">⏱</div><div class="info-val" id="timer">0</div></div>
          <button class="game-btn" onclick="newGame()">🔄</button>
        </div>
      </div>
      <div class="board-center"><div id="ms-board" class="ms-board"></div></div>
      <div id="result-msg" class="overlay-msg" style="display:none"></div>
      <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:10px">좌클릭: 열기 · 우클릭(모바일 길게 누르기): 깃발 🚩</p>
    </div>
    <div style="margin-top:20px">
      <div class="section-title">다른 게임</div>
      <div class="related-grid">
        <a href="game-apple.html" class="related-card"><div class="r-icon">🍎</div>사과 게임</a>
        <a href="game-2048.html" class="related-card"><div class="r-icon">🔢</div>2048</a>
        <a href="game-memory.html" class="related-card"><div class="r-icon">🃏</div>카드 메모리</a>
        <a href="game-snake.html" class="related-card"><div class="r-icon">🐍</div>스네이크</a>
      </div>
    </div>
  </main>
  <aside class="side-ad"><div class="side-ad-inner">광고 영역<br/>160×600</div></aside>
</div>
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-links"><a href="index.html">홈</a><a href="privacy.html">개인정보처리방침</a></div>
    <p class="footer-copy">© 2026 CalcZip. All rights reserved.</p>
  </div>
</footer>
<script>
const DIFFS = { easy:{r:9,c:9,m:10}, medium:{r:16,c:16,m:40}, hard:{r:16,c:30,m:99} };
let diff='easy', rows, cols, mines, board, revealed, flagged, gameOver, firstClick, timerInterval, elapsed;

function setDiff(d) {
  diff = d;
  document.querySelectorAll('.diff-btn').forEach((b,i)=>b.classList.toggle('active',['easy','medium','hard'][i]===d));
  newGame();
}

function newGame() {
  clearInterval(timerInterval);
  const cfg = DIFFS[diff];
  rows=cfg.r; cols=cfg.c; mines=cfg.m;
  board = Array(rows).fill(null).map(()=>Array(cols).fill(0));
  revealed = Array(rows).fill(null).map(()=>Array(cols).fill(false));
  flagged  = Array(rows).fill(null).map(()=>Array(cols).fill(false));
  gameOver=false; firstClick=true; elapsed=0;
  document.getElementById('mine-count').textContent = mines;
  document.getElementById('timer').textContent = '0';
  document.getElementById('result-msg').style.display = 'none';
  render();
}

function placeMines(sr, sc) {
  let placed = 0;
  while (placed < mines) {
    const r=Math.floor(Math.random()*rows), c=Math.floor(Math.random()*cols);
    if (board[r][c]!=-1 && !(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)) { board[r][c]=-1; placed++; }
  }
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
    if(board[r][c]===-1) continue;
    let cnt=0;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) { const nr=r+dr,nc=c+dc; if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]===-1) cnt++; }
    board[r][c]=cnt;
  }
}

function reveal(r,c) {
  if(r<0||r>=rows||c<0||c>=cols||revealed[r][c]||flagged[r][c]) return;
  revealed[r][c]=true;
  if(board[r][c]===0) for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) reveal(r+dr,c+dc);
}

function open(r,c) {
  if(gameOver||revealed[r][c]||flagged[r][c]) return;
  if(firstClick) {
    firstClick=false; placeMines(r,c);
    timerInterval = setInterval(()=>{ elapsed++; document.getElementById('timer').textContent=elapsed; },1000);
  }
  if(board[r][c]===-1) { revealAll(r,c); return; }
  reveal(r,c);
  render();
  checkWin();
}

function flag(r,c) {
  if(gameOver||revealed[r][c]) return;
  flagged[r][c]=!flagged[r][c];
  const remaining = mines - flagged.flat().filter(Boolean).length;
  document.getElementById('mine-count').textContent = remaining;
  render();
}

function revealAll(er,ec) {
  gameOver=true; clearInterval(timerInterval);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(board[r][c]===-1) revealed[r][c]=true;
  render();
  document.querySelectorAll('.ms-cell')[er*cols+ec].classList.add('exploded');
  showResult('💥 Game Over! ' + elapsed + '초 플레이', false);
}

function checkWin() {
  const safe = rows*cols - mines;
  const rev  = revealed.flat().filter(Boolean).length;
  if(rev===safe) { gameOver=true; clearInterval(timerInterval); showResult('🎉 클리어! ' + elapsed + '초', true); }
}

function showResult(msg, win) {
  const el = document.getElementById('result-msg');
  el.style.display = '';
  el.innerHTML = `<div style="font-size:20px;font-weight:800;margin-bottom:10px">${msg}</div><button class="game-btn" onclick="newGame()">다시 하기</button>`;
}

function render() {
  const el = document.getElementById('ms-board');
  el.style.gridTemplateColumns = `repeat(${cols},32px)`;
  el.innerHTML = '';
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
    const btn = document.createElement('div');
    const rid=r, cid=c;
    btn.className = 'ms-cell';
    if(revealed[r][c]) {
      btn.classList.add(board[r][c]===-1?'mine':'open');
      if(board[r][c]===-1) btn.textContent='💣';
      else if(board[r][c]>0) { btn.textContent=board[r][c]; btn.classList.add('c'+board[r][c]); }
    } else if(flagged[r][c]) {
      btn.classList.add('flagged'); btn.textContent='🚩';
    } else {
      btn.classList.add('hidden');
    }
    btn.addEventListener('click',()=>open(rid,cid));
    btn.addEventListener('contextmenu',e=>{ e.preventDefault(); flag(rid,cid); });
    let pressTimer;
    btn.addEventListener('touchstart',()=>{ pressTimer=setTimeout(()=>flag(rid,cid),500); },{passive:true});
    btn.addEventListener('touchend',()=>clearTimeout(pressTimer));
    el.appendChild(btn);
  }
}

function toggleDark() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark?'light':'dark');
  localStorage.setItem('calczip-theme', isDark?'light':'dark');
  document.getElementById('dark-btn').textContent = isDark?'🌙':'☀️';
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('dark-btn').textContent = document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙';
  newGame();
});
</script>
</body>
</html>
